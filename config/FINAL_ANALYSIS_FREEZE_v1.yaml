analysis_boundaries:
  - "Broad scDRS/MAGMA enrichment is associative and does not identify a causal cell of origin."
  - "POAG–RE cellular-profile similarity compares standardized broad-cell effects and does not imply shared signed allelic effects."
  - "No donor-replicated Müller state or robust positive NMF program was supported."
  - "Pooled official OCR annotations did not yield FDR-supported cell-class enrichment."
  - "The RE phenotype is European composite refractive-error genetic liability, not pure quantitative MSE."
  - "The three-indicator GenomicSEM factor is descriptive and saturated."
