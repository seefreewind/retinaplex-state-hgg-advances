paper_story:
  primary_claim: "Ocular disorders with heterogeneous and in some cases oppositely signed genome-wide genetic architectures show diffuse polygenic organization but converge transcriptionally on Müller glia at the broad cellular level."
  secondary_claim: "Refractive-error genetic liability additionally localizes to amacrine cells, indicating mixed shared and trait-specific retinal cellular contexts."
  boundary: "The broad RNA-defined convergence does not resolve into a reproducible Müller transcriptional state and is not independently supported by cell-class open-chromatin enrichment in the available regulatory atlas."
  causal_scope: associative_only

